[images."apache/kafka:3.7.0"]
strategy      = "pull"
stop_timeout  = 60
ready_timeout = 240
est_minutes   = 5
tests = []

[images."provectuslabs/kafka-ui:v0.7.2"]
strategy    = "pull"
est_minutes = 3
tests = [
  { type = "http", url = "http://kafka-ui:8080/actuator/health", expect = "lt500" },
]

[images."weather-weather-producer:latest"]
strategy    = "build"
build       = { context = "/opt/ppd/stacks/weather/producer", dockerfile = "/opt/ppd/stacks/weather/producer/Dockerfile" }
est_minutes = 4
tests = []

[images."weather-weather-consumer:latest"]
strategy    = "build"
