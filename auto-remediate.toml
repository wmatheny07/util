tests = []

# ── MathenyManor ──────────────────────────────────────────────────────────────

[images."mathenymanor-agent_api:latest"]
strategy    = "build"
build       = { context = "/opt/mathenymanor/agent_api", dockerfile = "/opt/mathenymanor/agent_api/Dockerfile" }
est_minutes = 5
tests = [
  { type = "http", url = "http://agent-api:8000/api/health" },
]

[images."mathenymanor-agent_web:latest"]
strategy    = "build"
build       = { context = "/opt/mathenymanor/agent_web", dockerfile = "/opt/mathenymanor/agent_web/Dockerfile", args = { VITE_API_URL = "https://agents.mathenymanor.com/api" } }
est_minutes = 6
tests = [
  { type = "http", url = "http://agent-web:80/", network = "mathenymanor.docker" },
]

[images."mathenymanor-health-api:latest"]
strategy    = "build"
build       = { context = "/opt/mathenymanor/health-api", dockerfile = "/opt/mathenymanor/health-api/Dockerfile" }
est_minutes = 5
tests = [
  { type = "http", url = "http://health-api:8000/docs" },
]

[images."rclone/rclone:latest"]
strategy    = "pull"
version_cmd = "rclone version | head -1"
max_jump    = "minor"
est_minutes = 3
tests = [
  { type = "http", url = "http://rclone:8090/",      network = "mathenymanor.docker", expect = "lt500" },
  { type = "http", url = "http://rclone-mail:8091/", expect = "lt500" },
]

[images."ghcr.io/home-assistant/home-assistant:stable"]
strategy      = "pull"
version_cmd   = "python3 -c 'import importlib.metadata as m; print(m.version(\"homeassistant\"))'"
max_jump      = "minor"
backup_container_paths = ["/config"]
ready_timeout = 300
est_minutes   = 8
tests = [
  { type = "http", url = "http://127.0.0.1:8123/", network = "host" },
]

[images."homebridge/homebridge:latest"]
strategy      = "pull"
ready_timeout = 240
est_minutes   = 5
tests = [
  { type = "http", url = "http://127.0.0.1:8581/", network = "host", expect = "lt500" },
]

[images."linuxserver/plex:latest"]
strategy      = "pull"
ready_timeout = 240
est_minutes   = 5
tests = [
  { type = "http", url = "http://127.0.0.1:32400/identity", network = "host" },
]

# ── Edge + security tooling (last: nginx fronts everything, scanner runs the scans) ──

[images."ppd-nginx:latest"]
strategy    = "build"
build       = { context = "/opt/nginx", dockerfile = "/opt/nginx/Dockerfile" }
est_minutes = 4
tests = [
  { type = "exec", container = "nginx", cmd = ["nginx", "-t"] },
  { type = "http", url = "http://nginx:80/", expect = "lt500" },
]

[images."ppd-security-frontend:latest"]
strategy    = "build"
build       = { context = "/opt/ppd/stacks/security/frontend", dockerfile = "/opt/ppd/stacks/security/frontend/Dockerfile" }
est_minutes = 4
tests = [
  { type = "http", url = "http://security-frontend:80/" },
]

[images."ppd-security-scanner:latest"]
strategy    = "build"
build       = { context = "/opt/ppd/stacks/security/scanner", dockerfile = "/opt/ppd/stacks/security/scanner/Dockerfile" }
est_minutes = 6
tests = [
  { type = "http", url = "http://security-scanner:8000/health" },
]
